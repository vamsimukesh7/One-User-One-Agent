[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-user-one-agent"
version = "0.1.0"
description = "Evidence-driven viewer lifecycle agent with reproducible local evaluation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
one-agent = "one_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
